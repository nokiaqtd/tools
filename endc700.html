<!doctype html>
<html lang="en">

<head>
  <script>
  const APP_VERSION = "endc3h 261120 3"; // Type manually here
  </script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>endc3c</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f6f8fb;
      --card: #ffffff;
      --muted: #6b7280;
      --accent: #0f62ff;
      --radius: 12px;
    }

    body {
      font-family: Inter, system-ui, Segoe UI, Roboto, "Helvetica Neue", Arial;
      margin: 0;
      background: var(--accent);
      color: #0b1220
    }

    .wrap {
      max-width: 1100px;
      margin: 28px auto;
      padding: 20px
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: 0 6px 18px rgba(11, 17, 32, 0.06);
      padding: 20px
    }

    h2 {
      margin: 0 0 6px;
      font-size: 20px
    }

    .lead {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 13px
    }

    .row {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      flex-wrap: wrap
    }

    .column {
      flex: 1;
      min-width: 300px
    }

    input[type=file] {
      display: block
    }

    .controls {
      display: flex;
      gap: 8px;
      margin-top: 12px
    }

    button {
      background: var(--accent);
      color: #fff;
      border: 0;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600
    }

    button.ghost {
      background: #eef2ff;
      color: var(--accent);
      border: 1px solid rgba(15, 98, 255, 0.08)
    }

    .small {
      font-size: 12px;
      color: var(--muted)
    }

    .file-block {
      background: #fbfdff;
      border-radius: 8px;
      padding: 12px;
      border: 1px solid #eef6ff
    }

    label.small {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px
    }

    /* REPLACE existing #logArea block with this */
    #logArea {
      white-space: pre-wrap;
      background: #0b1220;
      color: #e6eefb;
      /* padding: top right bottom left — bottom is larger for extra space inside the area */
      padding: 12px 12px 28px 12px;
      border-radius: 8px;
      margin-top: 12px;
      /* margin below the log area so it doesn't touch modal footer */
      margin-bottom: 16px;
      /* allow it to grow to most of the viewport but leave room for modal header/footer */
      max-height: calc(100vh - 160px);
      height: auto;
      overflow: auto;
      font-family: monospace;
      font-size: 12px;
      display: none;
      /* keep whatever show/hide behaviour you already use */
      box-sizing: border-box;
      /* include padding in the size calculation */
    }


    #warningsBlock {
      margin-top: 10px;
      white-space: pre-wrap;
      background: #fff7f0;
      border-radius: 6px;
      padding: 8px;
      border: 1px solid #ffd8b5;
      color: #7a3b00;
      max-height: 220px;
      overflow: auto;
      font-family: monospace
    }

    /* paste sheet */
    .paste-area {
      margin-top: 14px
    }

    .sheet-controls {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px
    }

    .sheet-table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 8px;
      overflow: hidden
    }

    .sheet-table th,
    .sheet-table td {
      padding: 8px;
      border-bottom: 1px solid #f1f5f9;
      font-size: 13px;
      text-align: left
    }

    .sheet-table th {
      background: #f8fafc;
      color: var(--muted);
      font-weight: 600
    }

    .muted-note {
      color: var(--muted);
      font-size: 12px;
      margin-top: 6px
    }

    .right-col {
      width: 300px
    }

    .input-text {
      width: 100%;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #e6eefb;
      margin-top: 6px
    }

    .btn-ghost {
      background: #fff;
      border: 1px solid #e6eefb;
      color: var(--accent);
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer
    }

    #pasteBox {
      border: 3px solid #0d6efd;
      /* brighter, thicker blue */
      border-radius: 6px;
      outline: none;
      background-color: #f8fbff;
      /* very light blue background for contrast */
      box-shadow: 0 0 6px rgba(13, 110, 253, 0.6);
      /* subtle glow */
      transition: box-shadow 0.2s ease, border-color 0.2s ease;
    }

    #pasteBox:focus {
      border-color: #0056b3;
      /* darker blue on focus */
      box-shadow: 0 0 8px rgba(0, 86, 179, 0.8);
      /* stronger glow when focused */
    }

    #topVersion {
      position: fixed;
      top: 4px;
      left: 8px;
      color: #ffffff;
      font-size: 11px;
      z-index: 9999;
      opacity: 0.8;
    }

    .file-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .flex-1 {
      flex: 1;
    }

    .paste-textarea {
      width: 100%;
      min-height: 80px;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #eef6ff;
      margin-top: 8px;
      font-family: inherit;
      box-sizing: border-box;
    }

    .paste-actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .row-counter {
      margin-left: auto;
      color: var(--muted);
    }

    .table-wrap {
      margin-top: 10px;
      overflow: auto;
      border-radius: 8px;
    }

    #warningsArea {
      margin-top: 12px;
    }

    #downloadBtn {
      display: none;
    }

    .profile-label {
      display: block;
      margin-bottom: 4px;
    }

    .profile-controls {
      margin-top: 4px;
      flex-direction: column;
    }

    .profile-btns {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .mt-8 {
      margin-top: 8px;
    }

    #status {
      margin-top: 12px;
      color: var(--muted);
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
    }
  </style>
</head>

<body>
	<div id="topVersion"></div>

	<script>
	  document.addEventListener('DOMContentLoaded', () => {
		document.getElementById('topVersion').textContent = APP_VERSION;
	  });
	</script>

  <div class="wrap">
    <div class="card" role="main" aria-labelledby="title">
      <h2 id="title">ENDC Tool</h2>
      <p class="lead">Provide 4 mandatory inputs (LNCEL dump, IRFIM dump, LNHOIF dump, LNADJGNB dump)</p>

      <div class="row">
        <!-- left: file inputs + paste sheet -->
        <div class="column">
          <div class="file-block" aria-label="File inputs">
            <div class="file-list">
              <div class="file-item">
                <label class="small" for="fileLNCEL">1) LNCEL dump (CSV)</label>
                <input id="fileLNCEL" type="file" accept=".csv" />
              </div>
              <div class="file-item">
                <label class="small" for="fileIRFIM">2) IRFIM dump (CSV)</label>
                <input id="fileIRFIM" type="file" accept=".csv" />
              </div>
              <div class="file-item">
                <label class="small" for="fileLNHOIF">3) LNHOIF dump (CSV)</label>
                <input id="fileLNHOIF" type="file" accept=".csv" />
              </div>
              <div class="file-item">
                <label class="small" for="fileLNADJGNB">4) LNADJGNB dump (CSV)</label>
                <input id="fileLNADJGNB" type="file" accept=".csv" />
              </div>
            </div>

            <div id="fileNotes" class="muted-note"></div>
          </div>

          <!-- modern paste sheet -->
          <div class="paste-area">
            <div class="sheet-controls">
              <div class="flex-1">
                <label class="small" for="pasteBox">Paste Data</label>
                <div id="columns" class="muted-note">Default columns: <strong>LNBTS | sid_tgt | sid_src | NRBTS |
                    cPlaneIpAddr | Remarks</strong></div>
              </div>
            </div>

            <!-- paste textarea (hidden by default, but accessible) -->
            <textarea id="pasteBox" class="paste-textarea" placeholder="Paste rows copied from Excel here then click Import Paste"></textarea>
            <div class="paste-actions">
              <button id="importPasteBtn" class="ghost btn-ghost" type="button">Import Paste</button>
              <button id="clearSheetBtn" class="ghost btn-ghost" type="button">Clear Sheet</button>
              <div class="small row-counter">Rows: <span id="sheetRowCount">0</span></div>
            </div>

            <!-- editable table -->
            <div class="table-wrap">
              <table id="sheetTable" class="sheet-table" role="table" aria-label="Paste sheet">
                <thead id="thead">
                  <tr>
                    <th>LNBTS</th>
                    <th>sid_tgt</th>
                    <th>sid_src</th>
                    <th>NRBTS</th>
                    <th>IP (cPlaneIpAddr)</th>
                    <th>Remarks</th>
                  </tr>
                </thead>
                <tbody>
                  <!-- rows inserted here -->
                </tbody>
              </table>
            </div>
          </div>

          <div id="warningsArea"></div>
        </div>

        <!-- right: controls + output name + log -->
        <div class="right-col">
          <!-- Hidden output filename and download button -->
          <input id="outname" type="hidden" value="NCR_ENDC.csv" />
          <button id="downloadBtn" type="button" aria-label="Download CSV"></button>
          
          <span class="small profile-label">Choose Profile</span>
          <div class="controls profile-controls">
            <div class="profile-btns">
              <button id="processDefaultBtn" class="ghost" type="button" disabled>Default</button>
              <button id="processRefarmingBtn" class="ghost" type="button" disabled>Refarming</button>
              <button id="processCoverageBtn" class="ghost" type="button" disabled>Coverage</button>
            </div>
            <div class="small mt-8"></div>
          </div>

          <div id="status" class="small"></div>

          <div id="logArea" aria-live="polite"></div>
        </div>
      </div>

      <div class="footer">
        <div class="small">ENDC UI — ready for wiring.</div>
        <div class="small">Version: 1.0.0</div>
      </div>
    </div>
  </div>

  <script>
    // Minimal UI helpers only (no processing logic).
    // Intentionally small and simple: these enable/disable buttons and provide the paste->table helper.
    // Placeholder comments show where your processing should be attached later.

    const fileLNCEL = document.getElementById('fileLNCEL');
    const fileIRFIM = document.getElementById('fileIRFIM');
    const fileLNHOIF = document.getElementById('fileLNHOIF');
    const fileLNADJGNB = document.getElementById('fileLNADJGNB');
    const processDefaultBtn = document.getElementById('processDefaultBtn');
    const processRefarmingBtn = document.getElementById('processRefarmingBtn');
    const processCoverageBtn = document.getElementById('processCoverageBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const outnameInput = document.getElementById('outname');
    const logArea = document.getElementById('logArea');
    const warningsArea = document.getElementById('warningsArea');

    const pasteBox = document.getElementById('pasteBox');
    const importPasteBtn = document.getElementById('importPasteBtn');
    const clearSheetBtn = document.getElementById('clearSheetBtn');
    const sheetTable = document.getElementById('sheetTable').querySelector('tbody');
    const thead = document.getElementById('thead');
    const sheetRowCount = document.getElementById('sheetRowCount');
    const columns = document.getElementById('columns');

    let csvLNBTS;
    if (sheetTable) {
      sheetTable.style.visibility = 'hidden';
      thead.style.visibility = 'hidden';
      // sheetTable.style.position = 'absolute';
    }

    // Enable Process button only when at least one file is selected or sheet has rows.
    function updateControls() {
      const filesSelected = fileLNCEL.files.length || fileIRFIM.files.length || fileLNHOIF.files.length || fileLNADJGNB.files.length;
      const rows = sheetTable.querySelectorAll('tr').length;
      const isValid = (filesSelected && rows);
      if(processDefaultBtn) processDefaultBtn.disabled = !isValid;
      if(processRefarmingBtn) processRefarmingBtn.disabled = !isValid;
      if(processCoverageBtn) processCoverageBtn.disabled = !isValid;
      if(downloadBtn) downloadBtn.disabled = true;
      document.getElementById('status').textContent = filesSelected ? 'Files selected' : 'No files selected';
    }

    [fileLNCEL, fileIRFIM, fileLNHOIF, fileLNADJGNB].forEach(el => el.addEventListener('change', updateControls));

    // Simple paste parser: accepts tab-delimited or comma-separated text.
    function parsePasteToRows(text) {
      const lines = text.replace(/\r\n/g, '\n').split('\n').map(l => l.trim()).filter(l => l.length);
      const rows = [];
      for (const line of lines) {
        // prefer tab split, fall back to comma
        let cols = line.split('\t');
        if (cols.length === 1) cols = line.split(',');
        rows.push(cols.map(c => c.trim()));
      }
      return rows;
    }

    function importPasteIntoTable() {
      const text = pasteBox.value.trim();
      if (!text) {
        warningsArea.innerHTML = '<div id="warningsBlock" style="color:#7a3b00">Paste area is empty.</div>';
        return;
      }
      const rows = parsePasteToRows(text);
      // Clear existing rows
      sheetTable.innerHTML = '';
      // For each pasted row, insert into 6 columns (missing columns padded)
      for (const cols of rows) {
        const tr = document.createElement('tr');
        for (let i = 0; i < 6; i++) {
          const td = document.createElement('td');
          td.contentEditable = "true";
          td.textContent = cols[i] || '';
          tr.appendChild(td);
        }
        sheetTable.appendChild(tr);
      }
      sheetRowCount.textContent = sheetTable.querySelectorAll('tr').length;
      warningsArea.innerHTML = '';
      updateControls();
    }


    importPasteBtn.addEventListener('click', () => {
      importPasteIntoTable(); // keep your original function call
      // after import, show sheetTable and hide pasteBox
      if (sheetTable) {
        thead.style.visibility = 'visible';
        sheetTable.style.visibility = 'visible';
        sheetTable.style.position = 'static';
      }
      if (pasteBox) {
        columns.style.visibility = 'hidden';
        pasteBox.style.visibility = 'hidden';
        pasteBox.style.position = 'absolute';
      }
    });

    clearSheetBtn.addEventListener('click', () => {
      sheetTable.innerHTML = '';
      pasteBox.value = '';
      sheetRowCount.textContent = '0';
      updateControls();

      // after clear, hide sheetTable and show pasteBox
      if (sheetTable) {
        thead.style.visibility = 'hidden';
        sheetTable.style.visibility = 'hidden';
        sheetTable.style.position = 'absolute';
      }
      if (pasteBox) {
        columns.style.visibility = 'visible';
        pasteBox.style.visibility = 'visible';
        pasteBox.style.position = 'static';
      }
    });

    // Simple row count update when table edited (delegation)
    sheetTable.addEventListener('input', () => {
      sheetRowCount.textContent = sheetTable.querySelectorAll('tr').length;
      updateControls();
    });

    // Placeholder: processBtn should be wired to your ENDC processing routine.
    // ----------------- START REPLACEMENT: wired ENDC processing -----------------
    function appendLog(msg) {
      const ts = (new Date()).toISOString();
      if (!logArea.style.display) logArea.style.display = 'block';
      // logArea.textContent += (logArea.textContent ? '\n' : '') + ts + ' ' + msg;
      logArea.textContent += (logArea.textContent ? '\n' : '') + ' ' + msg;
      logArea.scrollTop = logArea.scrollHeight;
    }

    function readSheetRows() {
      // returns array of row arrays (6 columns per row)
      const rows = [];
      const trs = sheetTable.querySelectorAll('tr');
      trs.forEach(tr => {
        const cols = Array.from(tr.children).slice(0, 6).map(td => td.textContent.trim());
        // consider empty first-column rows as skipped
        if (cols.every(c => c === '')) return;
        rows.push(cols);
      });
      return rows;
    }

    // Default column names for paste sheet
    const sheetHeaders = ['LNBTS', 'sid_tgt', 'sid_src', 'NRBTS', 'IP', 'Remarks'];

    // The special outLNBTS columns (names and defaults)
    const outCols = [
      '$dn',
      'actAdvStepwiseScellAdd','actEndcAdjCarrierChk','actEnhFlexCaWithEnDc','actUL256QamForEnDc','actUlTraffDrivUlCa','enableBwCombCheck','enableBwComSetChkEnDc','enableNonCompBcsChkEnDc',
      'actIdleLBEnDcAware', 'actTransmittedBelowGap', 'actCAggrLteNrDualConnectivity', 'actDynTrigLteNrDualConnectivity',
      'actEndcSpidFwd', 'actLteNrDualConnectivity', 'endcSchedWeightBoostDl', 'endcSchedWeightBoostUl', 'nrRestrictionOverride',
      'actEndcAutoX2Setup', 'actUeBasedAnrNr', 'actUeBasedAnrNrHo', 'actEndcHo', 'actHoWoSnChg', 'actSnChangeSnInit',
      'actLteNrFastNbrRelAdd', 'pdcpProf1001pdcpProfileId', 'pdcpProf1001pi2Target', 'pdcpProf1001snSizeDl', 'pdcpProf1001snSizeUl',
      'pdcpProf1001statusRepReq', 'pdcpProf1001tDiscard', 'pdcpProf1001pi2TargetDelay', 'pdcpProf1001pi2TargetSize', 'pdcpProf1001pi2Variant',
      'qciTab5lteNrDualConnectSupport', 'qciTab6lteNrDualConnectSupport', 'qciTab6nrPdcpProfIdx', 'qciTab7lteNrDualConnectSupport', 'qciTab7nrPdcpProfIdx',
      'qciTab8lteNrDualConnectSupport', 'qciTab8nrPdcpProfIdx', 'qciTab9lteNrDualConnectSupport', 'qciTab9nrPdcpProfIdx', 'tLteNrDualConnectPrep', 'tS1eRABModInd'
    ];

    // Provided default values in order (some positions intentionally blank if input omitted).
    // If there are fewer values than outCols-1, remaining will be filled with ''.

    const providedDefaults = [
      '0','1','1','1','0','1','1','1','1', '0', '2', '1', '0', '1', '2', '2', '0', '', '1', '', '1', '3', '1', '1', '1001', '10', '3', '3', '3', '300', '700', '35', '0', '0', '1', '1001', '1', '1001', '1', '1001', '1', '1001', '500', '2000'
    ];

    // build map from column name -> default value (safer than index shifts)
    var defaultsMap = {};
    for (var i = 0; i < outCols.length; i++) {
      var col = outCols[i];
      if (col === '$dn') {
        defaultsMap[col] = undefined; // computed per-row
      } else {
        // providedDefaults aligns with outCols starting at index 1
        defaultsMap[col] = (providedDefaults[i - 1] !== undefined) ? providedDefaults[i - 1] : '';
      }
    }

    function buildDefaultRowFor(lnbts) {
      var row = {};
      for (var i = 0; i < outCols.length; i++) {
        var col = outCols[i];
        if (col === '$dn') {
          row[col] = 'PLMN-PLMN/MRBTS-' + lnbts + '/LNBTS-' + lnbts;
        } else {
          row[col] = defaultsMap[col];
        }
      }
      // trace column (kept last in object but CSV order is controlled by headers below)
      row['src_LNBTS'] = lnbts;
      return row;
    }

    function toCSV(rows, headers) {
      // simple RFC4180-ish CSV builder (commas, quote fields if they contain comma/quote/newline)
      const esc = v => {
        if (v === null || v === undefined) return '';
        const s = String(v);
        if (s.includes('"') || s.includes(',') || s.includes('\n')) {
          return '"' + s.replace(/"/g, '""') + '"';
        }
        return s;
      };
      let csv = headers.map(esc).join(',') + '\n';
      for (const r of rows) {
        const line = headers.map(h => esc(r[h] === undefined ? '' : r[h])).join(',');
        csv += line + '\n';
      }
      return csv;
    }

    async function runProcess(profile) {
      try {
        // Dynamic active state styling
        const btnMap = {
          default: processDefaultBtn,
          refarming: processRefarmingBtn,
          coverage: processCoverageBtn
        };

        Object.keys(btnMap).forEach(key => {
          const btn = btnMap[key];
          if (!btn) return;
          if (key === profile) {
            btn.classList.remove('ghost');
            btn.style.backgroundColor = 'var(--accent)';
            btn.style.color = '#ffffff';
            btn.style.border = '0';
          } else {
            btn.classList.add('ghost');
            btn.style.backgroundColor = '#eef2ff';
            btn.style.color = 'var(--accent)';
            btn.style.border = '1px solid rgba(15, 98, 255, 0.08)';
          }
        });

        logArea.style.display = 'block';
        // reset log for this run (but preserve previous content in case)
        logArea.textContent = '';
        appendLog(`INFO: Process started (${profile} profile)`);

        let currentName = outnameInput.value;
        // Remove previous suffixes if they exist so they don't stack
        currentName = currentName.replace(/_(default|refarming|coverage)(?=\.csv$|$)/i, '');
        // Append new suffix
        const baseExt = currentName.toLowerCase().endsWith('.csv') ? currentName.slice(0, -4) : currentName;
        outnameInput.value = baseExt + '_' + profile + '.csv';

        // 1) quick checks
        const filesSelected = fileLNCEL.files.length && fileIRFIM.files.length && fileLNHOIF.files.length && fileLNADJGNB.files.length;
        const sheetRows = readSheetRows();
        appendLog(`DEBUG: filesSelected=${!!filesSelected}, sheetRows=${sheetRows.length}`);

        if (!filesSelected) {
          appendLog('ERROR: Four CSV inputs must be selected (LNCEL, IRFIM, LNHOIF, LNADJGNB). Aborting.');
          return;
        }
        if (!sheetRows.length) {
          appendLog('ERROR: No rows found on the paste sheet. Aborting.');
          return;
        }

        // 2) Build LNBTSmap (all rows) and uLNBTSmap (unique LNBTS values)
        const LNBTSmap = []; // array of row objects
        const uLNBTSset = new Set();
        const uLNBTSarr = []; // preserve order

        for (let i = 0; i < sheetRows.length; i++) {
          const cols = sheetRows[i];
          const rowObj = {};
          for (let j = 0; j < sheetHeaders.length; j++) {
            rowObj[sheetHeaders[j]] = cols[j] || '';
          }
          LNBTSmap.push(rowObj);

          const lnbtsVal = (rowObj['LNBTS'] || '').trim();
          if (lnbtsVal && !uLNBTSset.has(lnbtsVal)) {
            uLNBTSset.add(lnbtsVal);
            uLNBTSarr.push(lnbtsVal);
          }
        }

        appendLog(`INFO: Built LNBTSmap with ${LNBTSmap.length} rows.`);
        appendLog(`INFO: Found ${uLNBTSarr.length} unique LNBTS values.`);


        function NOKLTE_LNBTS(uLNBTSarr) {
          // returns { headers, rows } (does not produce CSV here)
          const outLNBTS = [];
          for (const lnbts of uLNBTSarr) {
            const r = buildDefaultRowFor(lnbts);
            r['src_LNBTS'] = lnbts;
            outLNBTS.push(r);
          }
          appendLog(`INFO: outLNBTS with ${outLNBTS.length} rows.`);

          // header ordered
          const headers = outCols.slice(); // outCols must be defined elsewhere as your column order
          // if you want src_LNBTS included:
          // headers.push('src_LNBTS');

          return { headers, rows: outLNBTS };
        }



        // ---------- CSV parser that supports header on arbitrary row (headerRow is 1-based) ----------
        const parsedCSVCache = {}; // key by element id + headerRow

        function parseCSVTextToObjects(text, headerRow = 1) {
          // headerRow: 1-based index of the line that contains headers (default 1)
          // returns array of objects mapping header -> value

          // normalize to string
          text = String(text || '');

          // split into lines preserving quoted newline handling
          const lines = [];
          let cur = '';
          let inQuotes = false;
          for (let i = 0; i < text.length; i++) {
            const ch = text[i];
            cur += ch;
            if (ch === '"') {
              // handle escaped double quote
              if (text[i + 1] === '"') {
                cur += '"';
                i++;
                continue;
              }
              inQuotes = !inQuotes;
            }
            if ((ch === '\n' || ch === '\r') && !inQuotes) {
              // finalize line (strip trailing newline chars)
              lines.push(cur.replace(/\r?\n$/, ''));
              cur = '';
              if (ch === '\r' && text[i + 1] === '\n') i++; // skip next \n after \r
            }
          }
          if (cur.length) lines.push(cur);

          // helper: parse one CSV line into fields (handles quotes and escaped "")
          function parseLine(line) {
            const fields = [];
            let field = '';
            let inQ = false;
            for (let i = 0; i < line.length; i++) {
              const c = line[i];
              if (c === '"') {
                if (inQ && line[i + 1] === '"') { field += '"'; i++; continue; } // escaped quote
                inQ = !inQ;
                continue;
              }
              if (!inQ && c === ',') {
                fields.push(field);
                field = '';
                continue;
              }
              field += c;
            }
            fields.push(field);
            return fields.map(f => f.trim());
          }

          if (!lines.length) return [];

          // clamp headerRow
          const hr = Math.max(1, Math.min(headerRow, lines.length)); // 1-based safe
          const headerLine = lines[hr - 1] || '';
          const header = parseLine(headerLine);

          // data lines start from headerRow index (1-based), i.e. the line *after* headerRow in most cases,
          // but if headerRow points to row 1 and you want data from row 2, start at hr
          const objs = [];
          for (let i = hr; i < lines.length; i++) {
            if (!lines[i].trim()) continue;
            const vals = parseLine(lines[i]);
            const o = {};
            for (let j = 0; j < header.length; j++) {
              const key = header[j];
              // Prevent horizontal table stitching from overwriting valid data
              // by only saving the first occurrence of a column name
              if (key && !(key in o)) {
                o[key] = vals[j] !== undefined ? vals[j] : '';
              }
            }
            objs.push(o);
          }
          return objs;
        }

        // ---------- read file input and parse with optional headerRow (default 1) ----------
        function readFileInputToObjects(fileInputEl, headerRow = 1) {
          // returns Promise<array of objects>
          return new Promise((resolve, reject) => {
            if (!fileInputEl || !fileInputEl.files || !fileInputEl.files.length) {
              resolve([]); // empty if not selected
              return;
            }
            const fname = fileInputEl.id || (fileInputEl.files[0] && fileInputEl.files[0].name) || 'unknown';
            const cacheKey = `${fname}::hr${headerRow}`;
            if (parsedCSVCache[cacheKey]) {
              resolve(parsedCSVCache[cacheKey]);
              return;
            }
            const fr = new FileReader();
            fr.onerror = () => reject(new Error('Failed reading ' + fname));
            fr.onload = () => {
              try {
                const txt = fr.result;
                const objs = parseCSVTextToObjects(String(txt || ''), headerRow);
                parsedCSVCache[cacheKey] = objs;
                resolve(objs);
              } catch (e) {
                reject(e);
              }
            };
            fr.readAsText(fileInputEl.files[0]);
          });
        }


        // Utility: safe includes (case-insensitive)
        function ciIncludes(hay, needle) {
          if (hay === null || hay === undefined) return false;
          if (needle === null || needle === undefined) return false;
          return String(hay).toLowerCase().indexOf(String(needle).toLowerCase()) !== -1;
        }

        // Utility: pull digits part of 'LNCEL-xxx' (fallback to last digits sequence)
        function extractLNCELNumber(distName) {
          if (!distName) return '';
          const m = /LNCEL-?(\d+)/i.exec(distName);
          if (m && m[1]) return m[1];
          const mm = distName.match(/(\d{1,4})\b(?!.*\d)/); // last 1-4 digits
          return mm ? mm[1] : '';
        }

        async function NOKLTE_LNADJGNB(LNBTSmap) {
          // returns { headers, rows, uLNADJGNB, LNADJGNBmap }
          // header col#1: $dn
          const headers = [
            '$dn', 'adjGnbId', 'adjGnbIdLength', 'administrativeState', 'cPlaneIpAddr', 'cPlaneIpAddrCtrl',
            'lbpsblockedNrAct', 'mcc', 'mnc', 'mncLength', 'x2ToGnbLinkStatus'
          ];

          // Read headers from row 2
          const src = await readFileInputToObjects(fileLNADJGNB, 2);
          const rows = [];
          const uLNADJGNB = {};   // map LNBTS -> Set(indices) plus lookup LNBTS:index -> adjGnbId
          const LNADJGNBmap = {}; // map LNBTS -> array of existing { index, adjGnbId, row }

          if (!src.length) {
            appendLog('WARN: LNADJGNB file empty or not provided.');
            return { headers, rows, uLNADJGNB, LNADJGNBmap };
          }

          // helper: case-insensitive field lookup
          function getField(obj, key) {
            if (!obj) return undefined;
            if (key in obj) return obj[key];
            const lk = key.toLowerCase();
            for (const k of Object.keys(obj)) {
              if (k && k.toLowerCase() === lk) return obj[k];
            }
            return undefined;
          }

          // 1) Build set of LNBTS values from provided LNBTSmap for matching
          const LNBTSset = new Set();
          for (const r of (LNBTSmap || [])) {
            const v = (r && (r.LNBTS || r.Lnbts || r.lnbts)) ? String(r.LNBTS || r.Lnbts || r.lnbts).trim() : '';
            if (v) LNBTSset.add(v);
          }

          // 2) Scan dump rows and populate LNADJGNBmap & uLNADJGNB for existing entries
          for (const r of src) {
            // find dn column
            const dnVal = getField(r, 'distName') || getField(r, '$dn') || getField(r, 'DistName') || getField(r, 'DN') || '';
            if (!dnVal) continue;

            // try to find which LNBTS this dump row belongs to (match any LNBTS in our set)
            let matchedLnbts = null;
            for (const candidate of LNBTSset) {
              if (ciIncludes(dnVal, candidate)) { matchedLnbts = candidate; break; }
            }
            if (!matchedLnbts) continue;

            // extract LNADJGNB index: last numeric after LNADJGNB-
            let idx = null;
            const m = /LNADJGNB-?(\d+)/i.exec(dnVal);
            if (m && m[1]) idx = parseInt(m[1], 10);
            else {
              // fallback: last numeric sequence
              const mm = dnVal.match(/(\d{1,4})\b(?!.*\d)/);
              idx = mm ? parseInt(mm[1], 10) : null;
            }

            // accept 0 as valid; only skip when idx is null/NaN
            if (idx === null || Number.isNaN(idx)) continue;


            let adjGnbId = getField(r, 'adjGnbId') || getField(r, 'adjGnbID') || getField(r, 'adjGnb') || '';
            adjGnbId = String(adjGnbId).trim(); // Ensure robust matching by trimming spaces

            // populate LNADJGNBmap
            if (!LNADJGNBmap[matchedLnbts]) LNADJGNBmap[matchedLnbts] = [];
            LNADJGNBmap[matchedLnbts].push({ index: idx, adjGnbId: adjGnbId, row: r });

            // populate uLNADJGNB structures
            if (!uLNADJGNB[matchedLnbts]) {
              uLNADJGNB[matchedLnbts] = { indices: new Set(), byIndex: {}, values: new Set() };
            }
            uLNADJGNB[matchedLnbts].indices.add(idx);
            uLNADJGNB[matchedLnbts].byIndex[idx] = adjGnbId;
            if (adjGnbId !== '') {
              uLNADJGNB[matchedLnbts].values.add(adjGnbId);
            }
            //appendLog(`DEBUG: Dump scan found MRBTS=${matchedLnbts}, LNADJGNB-${idx}, adjGnbId=${adjGnbId}`);
          }

        // start index from 1 instead of 0
        function generateUnusedIndex(lnbts) {
            const START = 1; // <-- start free indices from 1 now
            if (!uLNADJGNB[lnbts]) return START;
            const arr = Array.from(uLNADJGNB[lnbts].indices)
                .map(n => parseInt(n, 10))
                .filter(n => !isNaN(n))
                .sort((a, b) => a - b);

            if (!arr.length) return START;

            if (arr[0] > START) return START;

            for (let i = 0; i < arr.length - 1; i++) {
                const current = arr[i];
                const next = arr[i + 1];
                if (next - current > 1) {
                const candidate = current + 1;
                if (candidate >= START) return candidate;
                }
            }

            const last = arr[arr.length - 1];
            return Math.max(last + 1, START);
        }


          // 3) Generate rows from LNBTSmap (in original order)
          for (const item of (LNBTSmap || [])) {
            const lnbts = (item && item.LNBTS) ? String(item.LNBTS).trim() : (item && (item.Lnbts || item.lnbts) ? String(item.Lnbts || item.lnbts).trim() : '');
            if (!lnbts) continue;

            // candidate adjGnbId from paste sheet: sid_tgt, NRBTS, IP (in that order)
            const candidateAdj = (item.NRBTS && String(item.NRBTS).trim()) ||
              '';

            // ensure uLNADJGNB bucket exists
            if (!uLNADJGNB[lnbts]) uLNADJGNB[lnbts] = { indices: new Set(), byIndex: {}, values: new Set() };

            // determine non-duplicate index
            const newIndex = generateUnusedIndex(lnbts);

            // uniqueness check: if this adj exists already for this LNBTS, skip (non-unique)
            const candidateStr = String(candidateAdj || '').trim();
            appendLog(`DEBUG: Checking paste candidate MRBTS=${lnbts} with adjGnbId=${candidateStr}`);
            if (candidateStr !== '' && uLNADJGNB[lnbts].values.has(candidateStr)) {
              appendLog(`DEBUG: Skipping LNADJGNB creation for LNBTS ${lnbts} because adjGnbId "${candidateStr}" already exists.`);
              continue;
            }
            // if candidate is empty but an empty-string entry already exists, treat as non-unique and skip
            if (candidateStr === '' && uLNADJGNB[lnbts].values.has('')) {
              appendLog(`DEBUG: Skipping LNADJGNB creation for LNBTS ${lnbts} because empty adjGnbId already exists.`);
              continue;
            }

            // build row values:
            // if there is an existing LNADJGNB dump row with the chosen index, prefer its column values
            let existingRowForIndex = (LNADJGNBmap[lnbts] || []).find(e => parseInt(e.index, 10) === parseInt(newIndex, 10));
            const rowObj = {};

            // $dn
            rowObj['$dn'] = `PLMN-PLMN/MRBTS-${lnbts}/LNBTS-${lnbts}/LNADJGNB-${newIndex}`;

            // adjGnbId
            rowObj['adjGnbId'] = existingRowForIndex ? (getField(existingRowForIndex.row, 'adjGnbId') || '') : candidateStr || '';

            // adjGnbIdLength
            rowObj['adjGnbIdLength'] = 23; //rowObj['adjGnbId'] ? String(String(rowObj['adjGnbId']).length) : '';

            // administrativeState
            rowObj['administrativeState'] = 1; //existingRowForIndex ? (getField(existingRowForIndex.row, 'administrativeState') || '') : '';

            // cPlaneIpAddr (try paste sheet IP then dump)
            rowObj['cPlaneIpAddr'] = item.IP || item['cPlaneIpAddr'] || (existingRowForIndex ? (getField(existingRowForIndex.row, 'cPlaneIpAddr') || '') : '');

            // cPlaneIpAddrCtrl
            rowObj['cPlaneIpAddrCtrl'] = 0; //existingRowForIndex ? (getField(existingRowForIndex.row, 'cPlaneIpAddrCtrl') || '') : '';

            // lbpsblockedNrAct

            backgroundColor: 'rgba(0,0,0,0.45)',
            zIndex: '2147483646',
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'center',
            padding: '20px',
            WebkitOverflowScrolling: 'touch'
          });

          // create modal container (flex column)
          modal = document.createElement('div');
          modal.id = 'logModal';
          Object.assign(modal.style, {
            width: '75vw',
            height: '75vh',
            maxWidth: 'calc(100vw - 40px)',
            maxHeight: 'calc(100vh - 40px)',
            background: '#ffffff',
            borderRadius: '8px',
            boxShadow: '0 8px 30px rgba(0,0,0,0.4)',
            overflow: 'hidden', // let inner content scroll
            zIndex: '2147483647',
            position: 'relative',
            display: 'flex',
            flexDirection: 'column'
          });

          // content wrapper inside modal to hold the real logArea
          modalContent = document.createElement('div');
          modalContent.id = 'logModalContent';
          Object.assign(modalContent.style, {
            flex: '1 1 auto',
            minHeight: '0',        // important for proper flex child scrolling
            overflow: 'hidden',    // logArea will handle its own scrolling
            padding: '12px',
            boxSizing: 'border-box'
          });

          // ensure clicks inside modalContent do not close the overlay
          modalContent.addEventListener('click', (e) => e.stopPropagation());

          // Move the real logArea into the modalContent
          modal.appendChild(modalContent);
          modalContent.appendChild(logArea);

          // Ensure logArea fills modalContent and is scrollable and close to modal height
          Object.assign(logArea.style, {
            width: '100%',
            height: '97%',
            minHeight: '0',      // allow flex to size it correctly
            boxSizing: 'border-box',
            overflow: 'auto',
            display: 'block'
          });

          // clicking overlay (outside modal) closes it
          overlay.addEventListener('click', onOverlayClick);
          // pressing Escape closes
          window.addEventListener('keydown', onKeyDown);

          // add to document
          document.body.appendChild(overlay);
          document.body.appendChild(modal); // append modal to body (modal contains modalContent -> logArea)
          // actually put overlay behind modal visually by placing overlay first, then modal on top
          overlay.appendChild(modal); // move modal into overlay (keeps DOM tidy)

          // prevent body scroll while modal open
          document.documentElement.style.overflow = 'hidden';
          document.body.style.overflow = 'hidden';
        }

        function closeModal() {
          if (!overlay) return;

          overlay.removeEventListener('click', onOverlayClick);
          window.removeEventListener('keydown', onKeyDown);

          // restore logArea to original position
          if (originalParent) {
            if (originalNextSibling && originalNextSibling.parentNode === originalParent) {
              originalParent.insertBefore(logArea, originalNextSibling);
            } else {
              originalParent.appendChild(logArea);
            }
          }

          // restore inline style
          if (originalInlineStyle === '') logArea.removeAttribute('style');
          else logArea.setAttribute('style', originalInlineStyle);

          // clean DOM
          if (overlay.parentNode) overlay.parentNode.removeChild(overlay);

          // reset variables
          overlay = null;
          modal = null;
          modalContent = null;
          originalParent = null;
          originalNextSibling = null;
          originalInlineStyle = '';

          // restore body scroll
          document.documentElement.style.overflow = '';
          document.body.style.overflow = '';
        }

        function onOverlayClick(/*e*/) {
          closeModal();
        }

        function onKeyDown(e) {
          if (e.key === 'Escape' || e.key === 'Esc') {
            closeModal();
          }
        }

        // Click handler: open modal only if not already open.
        // Also ignore clicks on interactive elements inside logArea (links/buttons/inputs).
        logArea.addEventListener('click', function (e) {
          // If overlay exists modal is already open; do nothing.
          if (overlay) return;

          const tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : '';
          if (tag === 'a' || tag === 'button' || tag === 'input' || tag === 'textarea') return;

          openModal();
        });

        // Optional: close on Escape when focus is within logArea (also handled globally)
        // No further actions needed.
      });
    })();

        sheet.addEventListener('input', saveState); // if editable

            if (!inputEl || !filename) return false;
            try {
              // log('DEBUG: attempting fetch /debug_inputs/' + filename);
              const resp = await fetch('/debug_inputs/' + encodeURIComponent(filename), { cache: 'no-store' });
              if (!resp.ok) throw new Error('HTTP ' + resp.status);
              const blob = await resp.blob();
              // create File and assign via DataTransfer
              const fileObj = new File([blob], filename, { type: blob.type || 'application/octet-stream' });
              const dt = new DataTransfer();
              dt.items.add(fileObj);
              inputEl.files = dt.files;
              // log('DEBUG: assigned file ' + filename + ' to input ' + (inputEl.id || 'file-input'));
              return true;
            } catch (err) {
              // log('WARN: failed to auto-load ' + filename + ' (' + err.message + ')');
              return false;
            }
          }

          // try all
          for (const item of filesToTry) {
            if (item.name) await fetchAndAssign(item.input, item.name);
          }

          log('DEBUG: auto-load attempt finished.');
        } catch (err) {
          console.error(err);
